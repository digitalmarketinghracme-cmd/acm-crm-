services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_FILE: /data/acme.sqlite
      BACKUP_DIR: /backups
      TRUST_PROXY: "1"
    volumes:
      - crm-data:/data
      - ./backups:/backups
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  crm-data:
  caddy-data:
  caddy-config:
